# ============================================================
# 개발용 Docker Compose — PostgreSQL만 실행
# 사용법: docker compose -f docker-compose.dev.yml up -d
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: erp_db
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  erp_pgdata:
    name: erp_pgdata
